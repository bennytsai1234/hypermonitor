<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Hyperliquid Analysis - PWA2</title>
  <meta name="theme-color" content="#000000">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>

  <link rel="stylesheet" href="style.css">
  <style>
    /* Custom overrides for PWA2 */
    #chart-section {
        height: 100%;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
    }
    .chart-container {
        flex: 1;
        position: relative;
        width: 100%;
        min-height: 0;
    }
    .header-right {
        gap: 12px;
    }
    /* Dropdown arrow fix */
    .dropdown-arrow {
        font-size: 8px;
        margin-left: 6px;
    }
  </style>
</head>
<body>
  <div id="app" class="visible">
    <header id="app-header">
      <div class="header-left">
        <span class="header-icon">📈</span>
        <span class="header-title">HYPER ANALYSIS</span>
      </div>
      <div class="header-right">
          <!-- Range Dropdown -->
          <div class="custom-dropdown" id="range-dropdown">
            <div class="dropdown-trigger">
              <span class="selected-text">1小時</span>
              <div class="dropdown-arrow">▼</div>
            </div>
            <div class="dropdown-menu">
              <div class="dropdown-group">短期</div>
              <div class="dropdown-item active" data-value="1h">1小時</div>
              <div class="dropdown-item" data-value="4h">4小時</div>
              <div class="dropdown-item" data-value="12h">12小時</div>
              <div class="dropdown-group">中期</div>
              <div class="dropdown-item" data-value="1d">1天</div>
              <div class="dropdown-item" data-value="3d">3天</div>
              <div class="dropdown-item" data-value="1w">1週</div>
              <div class="dropdown-group">長期</div>
              <div class="dropdown-item" data-value="1m">1月</div>
            </div>
          </div>
          <button id="refresh-btn" class="icon-btn" title="刷新數據">🔄</button>
      </div>
    </header>

    <main id="content">
      <section id="chart-section">
        <div id="chart-switcher">
            <button class="switch-btn active" data-chart="net">淨壓力</button>
            <button class="switch-btn" data-chart="long">多單</button>
            <button class="switch-btn" data-chart="short">空單</button>
        </div>
        <div class="chart-container">
          <canvas id="analysis-chart"></canvas>
        </div>
      </section>

    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
